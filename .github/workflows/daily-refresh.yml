name: 定時更新海況（每 3 小時）

# 每 3 小時一次，對齊台灣時間：UTC 00,03,...,21 = 台灣 08,11,14,17,20,23,02,05
# （13 個地區 × 2 次 Open-Meteo 請求 × 8 次 = 每天約 208 次，遠低於免費額度 10,000 次/天）
#
# 為什麼不再打 Render 的 /api/refresh：
#   Render 免費方案共用出口 IP，Open-Meteo 對單一 IP 限流（429），後端把失敗吞掉、
#   回 updated_locations=0 但 HTTP 200，排程照樣綠勾。改成在 Actions runner 上直接跑
#   `python -m app.refresh` 寫入 Supabase；全數失敗會讓 job 變紅，部分失敗會出 warning。
#
# 需要的 Secrets（Settings → Secrets and variables → Actions → Secrets）：
#   DATABASE_URL  Supabase「Connection pooling」連線字串（postgresql+psycopg://...pooler.supabase.com...?sslmode=require）
#                 ⚠️ 必須用 pooler，不能用 db.<ref>.supabase.co 直連：直連只有 IPv6，GitHub runner 沒有 IPv6。
#   CWA_API_KEY   中央氣象署金鑰（潮汐用；沒設只會少潮汐，不會失敗）
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動觸發

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 檢查 DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::找不到 secret DATABASE_URL。請到 Settings → Secrets and variables → Actions 新增 Supabase pooler 連線字串（見 DEPLOY.md）"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      - name: 抓海況並寫入資料庫
        working-directory: backend
        run: python -m app.refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          USE_LLM: "false"
          # 正式 DB 的遷移只由 Render 部署時的 alembic upgrade head 負責
          SKIP_MIGRATIONS: "1"
