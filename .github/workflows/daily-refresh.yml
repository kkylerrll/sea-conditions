name: 定時更新海況（每 3 小時）

# 每 3 小時一次，對齊台灣時間：UTC 00,03,...,21 = 台灣 08,11,14,17,20,23,02,05
# （13 個地區 × 2 次 Open-Meteo 請求 × 8 次 = 每天約 208 次，遠低於免費額度 10,000 次/天）
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}   # 也可在 Actions 頁面手動觸發

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 呼叫後端 /api/refresh
        run: |
          curl -fsS -X POST "${{ vars.API_BASE || 'https://sea-conditions-api.onrender.com' }}/api/refresh?wait=true" \
            -H "Content-Type: application/json" \
            --max-time 300
        # 預設打 Render 網址；要換後端時在
        # repo Settings → Secrets and variables → Actions → Variables
        # 設 API_BASE 覆蓋即可
